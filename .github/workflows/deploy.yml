name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Must match the wasm-bindgen version bevy/rand resolve to (see
      # Cargo.lock) or wasm-bindgen will refuse to process the binary.
      - name: Install wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Build the game for wasm32
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generate JS bindings
        run: |
          mkdir -p web/src/wasm
          wasm-bindgen --target web --out-dir web/src/wasm --out-name solaris \
            target/wasm32-unknown-unknown/release/solaris.wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Shrink the wasm binary
        working-directory: web
        run: |
          npx wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
            -o src/wasm/solaris_bg.wasm src/wasm/solaris_bg.wasm

      # GitHub Pages project sites are served at
      # https://<user>.github.io/<repo>/, so the built app needs to know
      # its own base path. Update this if the repo is ever renamed.
      - name: Build the front end
        working-directory: web
        run: npm run build -- --base=/stellaris/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
